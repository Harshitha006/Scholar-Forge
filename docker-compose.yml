services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scholarforge
      POSTGRES_USER: sf
      POSTGRES_PASSWORD: sf
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  texlive:
    build: ./docker/texlive
    volumes:
      - ./tmp/latex:/workspace

  rag-service:
    build: ./rag_service
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data

  web:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - ollama
      - rag-service
    environment:
      DATABASE_URL: postgresql://sf:sf@postgres:5432/scholarforge
      OLLAMA_HOST: http://ollama:11434
      RAG_SERVICE_URL: http://rag-service:8001

volumes:
  pgdata:
  ollama_models:
